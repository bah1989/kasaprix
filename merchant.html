<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kasaprix — Espace Marchand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF; --bg-soft:#F7F6F2; --text:#15171C; --text-muted:#6E7280;
    --border:#E7E5DF; --orange:#FF6B1A; --green:#1D9A6C; --red:#D5443B;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg-soft);color:var(--text);font-family:'Inter',sans-serif;}
  .container{max-width:560px;margin:0 auto;padding:32px 20px 80px;}
  h1{font-family:'Manrope',sans-serif;font-weight:800;font-size:24px;margin:0 0 4px;}
  .sub{color:var(--text-muted);font-size:14px;margin:0 0 28px;}
  .card{background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:22px;margin-bottom:20px;}
  label{display:block;font-size:12.5px;font-weight:600;color:var(--text-muted);margin:0 0 5px;}
  input,select{width:100%;border:1.5px solid var(--border);border-radius:9px;padding:10px 12px;font-size:14px;font-family:inherit;margin-bottom:14px;}
  input:focus,select:focus{outline:none;border-color:var(--orange);}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:9px;font-weight:700;font-size:14px;padding:12px 18px;width:100%;}
  .btn-primary{background:var(--orange);color:#fff;}
  .msg{font-size:13px;margin-top:8px;}
  .msg.error{color:var(--red);}
  .msg.ok{color:var(--green);}
  #login-screen{max-width:360px;margin:80px auto;}
  .welcome{font-size:14px;color:var(--text-muted);margin-bottom:20px;}
  .welcome strong{color:var(--text);}
  .product-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);}
  .product-row img{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--bg-soft);flex-shrink:0;}
  .product-row .name{font-weight:600;font-size:14px;flex:1;}
  .product-row .price{font-weight:700;font-size:14px;color:var(--orange);flex-shrink:0;}
  .delete-btn{width:auto;padding:6px 10px;font-size:12px;font-weight:600;background:#FBEAEA;color:var(--red);border-radius:7px;flex-shrink:0;}
  .logout-link{color:var(--text-muted);font-size:13px;text-decoration:underline;cursor:pointer;background:none;border:none;padding:0;width:auto;font-weight:600;}
  .stat-row{padding:12px 0;border-bottom:1px solid var(--border);}
  .stat-row:last-child{border-bottom:none;}
  .stat-row .top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px;}
  .stat-row .pname{font-weight:600;font-size:14px;flex:1;}
  .stat-pill{display:inline-block;background:#FFF8E1;color:#B8860B;font-size:11px;font-weight:700;padding:2px 8px;border-radius:100px;}
  .stat-nums{display:flex;gap:16px;font-size:12.5px;color:var(--text-muted);}
  .stat-nums strong{color:var(--text);font-family:'Manrope',sans-serif;}
</style>
</head>
<body>

<div id="login-screen" class="container">
  <div class="card">
    <h1>Espace Marchand</h1>
    <p class="sub">Kasaprix — gérez vos produits vous-même</p>
    <label>Votre code d'accès</label>
    <input id="code-input" type="text" placeholder="Ex: a1b2c3d4" autocapitalize="off" autocorrect="off">
    <button class="btn-primary" id="login-btn">Se connecter</button>
    <p class="msg error" id="login-error"></p>
  </div>
</div>

<div id="merchant-screen" class="container" style="display:none">
  <h1 id="welcome-name">Bonjour</h1>
  <p class="welcome">Ajoutez un produit — il apparaît immédiatement sur Kasaprix.</p>

  <div class="card">
    <label>Nom du produit</label>
    <input id="p-name" placeholder="Ex: Mixeur Philips 3-en-1">
    <label>Prix (FCFA)</label>
    <input id="p-price" type="number" placeholder="Ex: 15000">
    <label>Photo du produit</label>
    <input id="p-image-file" type="file" accept="image/*">
    <input id="p-image" type="hidden">
    <p class="msg" id="p-image-status" style="margin-top:-10px;"></p>
    <label>Catégorie</label>
    <select id="p-category">
      <option value="">—</option>
      <option value="High-Tech">📱 High-Tech</option>
      <option value="Électroménager">🏠 Électroménager</option>
      <option value="Mode & Beauté">👗 Mode & Beauté</option>
      <option value="Supermarché">🛒 Supermarché</option>
    </select>
    <button class="btn-primary" id="publish-btn">Publier sur Kasaprix</button>
    <p class="msg" id="publish-msg"></p>
  </div>

  <div class="card">
    <h1 style="font-size:16px;margin:0 0 12px;">Mes produits en ligne</h1>
    <div id="my-products"></div>
  </div>

  <div class="card">
    <h1 style="font-size:16px;margin:0 0 4px;">Statistiques</h1>
    <p class="sub" style="margin:0 0 12px;">Vues et clics sur vos produits — utile pour savoir si vos sponsorisations fonctionnent.</p>
    <div id="my-stats"></div>
  </div>

  <button class="logout-link" id="logout-btn">Se déconnecter</button>
</div>

<script>
const SUPABASE_URL = "https://bxljzktkxphdbalbmgcn.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_w3bjyu8CeKjESzbLI7eCkQ_xdGTo_qw";
let ACCESS_CODE = sessionStorage.getItem('kasaprix_merchant_code') || '';
let MERCHANT_NAME = sessionStorage.getItem('kasaprix_merchant_name') || '';

async function rpc(name, body){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`, {
    method:'POST',
    headers:{ apikey: SUPABASE_ANON_KEY, Authorization:`Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type':'application/json' },
    body: JSON.stringify(body)
  });
  if(!res.ok) throw new Error(await res.text());
  return res.json();
}

function fmtPrice(n){
  return Number(n).toLocaleString('fr-FR', {maximumFractionDigits: 0}) + ' FCFA';
}

function showLogin(){
  document.getElementById('login-screen').style.display = 'block';
  document.getElementById('merchant-screen').style.display = 'none';
}
function showMerchant(){
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('merchant-screen').style.display = 'block';
  document.getElementById('welcome-name').textContent = 'Bonjour, ' + MERCHANT_NAME;
  loadMyProducts();
  loadMyStats();
}

async function loadMyStats(){
  const container = document.getElementById('my-stats');
  try{
    const stats = await rpc('merchant_offer_stats', { p_access_code: ACCESS_CODE });
    if(stats.length === 0){
      container.innerHTML = `<p class="sub" style="margin:0;">Pas encore de donnée — publiez un produit pour commencer à suivre ses performances.</p>`;
      return;
    }
    container.innerHTML = stats.map(s => `
      <div class="stat-row">
        <div class="top">
          <div class="pname">${s.product_name}</div>
          ${s.is_sponsored ? '<span class="stat-pill">⭐ Sponsorisé</span>' : ''}
        </div>
        <div class="stat-nums">
          <span>👁️ <strong>${s.impressions_total}</strong> vues (${s.impressions_7j} cette semaine)</span>
          <span>👆 <strong>${s.clicks_total}</strong> clics (${s.clicks_7j} cette semaine)</span>
        </div>
      </div>
    `).join('');
  }catch(e){
    container.innerHTML = `<p class="sub" style="margin:0;">Impossible de charger les statistiques pour l'instant.</p>`;
  }
}

document.getElementById('login-btn').addEventListener('click', async () => {
  const errorEl = document.getElementById('login-error');
  errorEl.textContent = '';
  const code = document.getElementById('code-input').value.trim();
  if(!code) return;
  try{
    const result = await rpc('merchant_login', { p_access_code: code });
    if(!result || result.length === 0) throw new Error('not found');
    ACCESS_CODE = code;
    MERCHANT_NAME = result[0].merchant_name;
    sessionStorage.setItem('kasaprix_merchant_code', ACCESS_CODE);
    sessionStorage.setItem('kasaprix_merchant_name', MERCHANT_NAME);
    showMerchant();
  }catch(e){
    errorEl.textContent = 'Code invalide. Vérifiez et réessayez.';
  }
});

document.getElementById('logout-btn').addEventListener('click', () => {
  sessionStorage.removeItem('kasaprix_merchant_code');
  sessionStorage.removeItem('kasaprix_merchant_name');
  ACCESS_CODE = '';
  document.getElementById('code-input').value = '';
  showLogin();
});

document.getElementById('p-image-file').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  const statusEl = document.getElementById('p-image-status');
  if(!file) return;
  statusEl.textContent = 'Envoi de la photo…';
  statusEl.className = 'msg';
  try{
    const ext = file.name.split('.').pop();
    const path = `${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
    const res = await fetch(`${SUPABASE_URL}/storage/v1/object/product-images/${path}`, {
      method:'POST',
      headers:{
        apikey: SUPABASE_ANON_KEY,
        Authorization:`Bearer ${SUPABASE_ANON_KEY}`,
        'x-merchant-code': ACCESS_CODE,
        'Content-Type': file.type || 'application/octet-stream'
      },
      body: file
    });
    if(!res.ok) throw new Error(await res.text());
    document.getElementById('p-image').value = `${SUPABASE_URL}/storage/v1/object/public/product-images/${path}`;
    statusEl.textContent = '✓ Photo envoyée.';
    statusEl.className = 'msg ok';
  }catch(err){
    statusEl.textContent = "Erreur lors de l'envoi de la photo.";
    statusEl.className = 'msg error';
  }
});

document.getElementById('publish-btn').addEventListener('click', async () => {
  const msg = document.getElementById('publish-msg');
  const name = document.getElementById('p-name').value.trim();
  const price = parseFloat(document.getElementById('p-price').value);
  if(!name || !price){
    msg.textContent = 'Le nom et le prix sont requis.';
    msg.className = 'msg error';
    return;
  }
  try{
    await rpc('merchant_add_offer', {
      p_access_code: ACCESS_CODE,
      p_product_name: name,
      p_price_xof: price,
      p_image_url: document.getElementById('p-image').value.trim() || null,
      p_category_name: document.getElementById('p-category').value || null,
      p_in_stock: true
    });
    msg.textContent = '✓ Produit publié sur Kasaprix !';
    msg.className = 'msg ok';
    document.getElementById('p-name').value = '';
    document.getElementById('p-price').value = '';
    document.getElementById('p-image').value = '';
    document.getElementById('p-image-file').value = '';
    document.getElementById('p-image-status').textContent = '';
    document.getElementById('p-category').value = '';
    loadMyProducts();
  }catch(e){
    msg.textContent = "Erreur lors de la publication. Réessayez.";
    msg.className = 'msg error';
  }
});

async function loadMyProducts(){
  try{
    const offers = await rpc('merchant_list_offers', { p_access_code: ACCESS_CODE });
    const container = document.getElementById('my-products');
    if(offers.length === 0){
      container.innerHTML = `<p class="sub" style="margin:0;">Aucun produit publié pour l'instant.</p>`;
      return;
    }
    container.innerHTML = offers.map(o => `
      <div class="product-row">
        ${o.image_url ? `<img src="${o.image_url}" alt="">` : `<div style="width:44px;height:44px;border-radius:8px;background:var(--bg-soft);"></div>`}
        <div class="name">${o.product_name}</div>
        <div class="price">${fmtPrice(o.price_xof)}</div>
        <button class="delete-btn" onclick="deleteProduct('${o.offer_id}')">Supprimer</button>
      </div>
    `).join('');
  }catch(e){}
}

window.deleteProduct = async function(offerId){
  if(!confirm('Supprimer ce produit de Kasaprix ?')) return;
  try{
    await rpc('merchant_delete_offer', { p_access_code: ACCESS_CODE, p_offer_id: offerId });
    loadMyProducts();
  }catch(e){}
}

if(ACCESS_CODE) showMerchant(); else showLogin();
</script>
</body>
</html>
